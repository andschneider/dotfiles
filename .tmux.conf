set -g default-terminal screen-256color

# configure top bar
set -g status-bg "#3c3836"
set -g status-fg white
set -g status-position top

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# split panes using current directory of existing pane
bind \\ split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# move panes like vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes like vim
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# window switching
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# toggle between current and previously active window
bind Tab last-window

# set delay between prefix and command
set -s escape-time 1

setw -g automatic-rename off

# set terminal title to session name
set-option -g set-titles on
set-option -g set-titles-string "#S"

# set window index to start at 1 for easier switching
set -g base-index 1

# set pane index to start at 1
set -g pane-base-index 1

# enable vi keys
setw -g mode-keys vi

# synchronize commands across panes
bind C-s set-window-option synchronize-panes

# enable mouse mode for scrolling and pane selection
set -g mouse on

# easier keybinding to enter copy mode
bind u copy-mode

# exit copy mode with Escape (in vi mode)
bind-key -T copy-mode-vi Escape send-keys -X cancel

# increase scrollback buffer (useful for long Claude outputs)
set -g history-limit 50000

# copy to system clipboard in copy mode (macOS)
bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"

# visual selection in copy mode (like vim)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
